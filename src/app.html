<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icons/icon-72.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="NioSports Pro — Análisis deportivo con datos y contexto para NBA y tenis, y control de tu bankroll." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NioSports Pro" />
    <meta property="og:title" content="NioSports Pro — Análisis deportivo con datos" />
    <meta property="og:description" content="Análisis deportivo con datos y contexto para NBA y tenis, y control de tu bankroll." />
    <meta property="og:url" content="https://nio-sports-pro-v4-0.vercel.app" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NioSports Pro — Análisis deportivo con datos" />
    <meta name="twitter:description" content="Análisis deportivo con datos y contexto para NBA y tenis, y control de tu bankroll." />

    <!-- Fonts: self-hosted (src/lib/styles/fonts.css). The two that paint the first
         screen are preloaded so headings never swap fonts after rendering. -->
    <link rel="preload" href="/fonts/barlow-condensed-latin-00a5e45f.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/dm-sans-latin-1c49a6eb.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Returning members get the loader instead of a flash of the public landing
         while the session is restored (flag set by +layout.svelte; no personal data). -->
    <script nonce="%sveltekit.nonce%">try{if(localStorage.getItem('nio:session'))document.documentElement.setAttribute('data-session','')}catch(e){}</script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
