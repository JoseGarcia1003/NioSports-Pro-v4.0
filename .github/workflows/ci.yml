name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  model-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/experiments/requirements.txt
      - name: Install isolated experiment dependencies
        run: python -m pip install -r ml/experiments/requirements.txt
      - name: Model fixture tests (not predictive validation)
        run: python -m unittest discover -s tests/experiments -v
      - name: Reproducible fixture matrix (no winner selected)
        run: python -m ml.experiments.run > phase04-fixture-smoke.json
      - name: Temporal isolation report (final test stays locked)
        run: python -m ml.validation.experiment > phase05-temporal.json
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-software-report-not-nba-performance
          path: |
            phase04-fixture-smoke.json
            phase05-temporal.json
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Python data contracts (stdlib only)
        run: python3 -m unittest discover -s tests/python -v

      - name: Build
        env:
          VITE_APP_VERSION: '4.0.0'
        run: npm run build

      - name: Build passed
        run: echo "✅ Build successful"
